[project]
name = "relay-backend"
version = "0.1.0"
description = "Autonomous food-rescue coordination from intake through verified delivery."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.19.2,<2",
    "asyncpg>=0.31.0,<1",
    "fastapi>=0.141.1,<1",
    "pydantic-settings>=2.10.1,<3",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0,<1",
    "httpx>=0.28.1,<1",
    "mypy>=1.17.1,<2",
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.8,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/app", "backend/tests"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
