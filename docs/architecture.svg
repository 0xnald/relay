<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Relay architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowHuman" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1240" height="760" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">Relay — autonomous food-rescue coordination</text>
  <text x="40" y="68" font-size="14" fill="#475569">OBSERVE → REASON → ACT → VERIFY → RECOVER → ESCALATE. The LLM never decides food safety.</text>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <rect x="820" y="30" width="18" height="14" rx="2" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="844" y="42">Deterministic policy / state logic</text>
    <rect x="1040" y="30" width="18" height="14" rx="7" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="1064" y="42">LLM reasoning (bounded)</text>
    <polygon points="829,52 838,60 829,68 820,60" fill="#fef3c7" stroke="#b45309"/>
    <text x="844" y="64">Human judgment</text>
    <rect x="1040" y="52" width="18" height="14" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="1064" y="64">Infrastructure / storage</text>
  </g>

  <!-- Lane: Command center -->
  <rect x="40" y="96" width="250" height="620" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="122" font-size="14" font-weight="700" fill="#0f172a">Command center</text>
  <text x="60" y="140" font-size="12" fill="#64748b">Next.js · Vercel</text>
  <rect x="60" y="160" width="210" height="110" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="70" y="182" font-size="12" font-weight="600" fill="#0f172a">Operations UI</text>
  <text x="70" y="200" font-size="11" fill="#334155">Overview · Rescues · Network</text>
  <text x="70" y="216" font-size="11" fill="#334155">Decisions · Activity · Policies</text>
  <text x="70" y="232" font-size="11" fill="#334155">Demo control (synthetic data)</text>
  <text x="70" y="256" font-size="11" fill="#64748b">same-origin /api/* proxy</text>

  <polygon points="165,330 240,370 165,410 90,370" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="165" y="365" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Coordinator</text>
  <text x="165" y="382" font-size="11" fill="#78350f" text-anchor="middle">resolves Decision Cards</text>

  <!-- Lane: Relay API -->
  <rect x="320" y="96" width="560" height="620" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="340" y="122" font-size="14" font-weight="700" fill="#0f172a">Relay API</text>
  <text x="340" y="140" font-size="12" fill="#64748b">FastAPI · Railway · Python 3.12</text>

  <!-- Event ingestion -->
  <rect x="340" y="160" width="220" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="183" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Event ingestion</text>
  <text x="450" y="201" font-size="11" fill="#1e3a8a" text-anchor="middle">typed · idempotent · versioned</text>

  <!-- Rescue engine -->
  <rect x="340" y="248" width="220" height="150" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="272" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Deterministic Rescue Engine</text>
  <text x="352" y="294" font-size="11" fill="#1e3a8a">Eligibility · Feasibility · Scoring</text>
  <text x="352" y="311" font-size="11" fill="#1e3a8a">Rescue state machine</text>
  <text x="352" y="328" font-size="11" fill="#1e3a8a">Recovery orchestrator</text>
  <text x="352" y="345" font-size="11" fill="#1e3a8a">Evidence &amp; handling gates</text>
  <text x="352" y="362" font-size="11" fill="#1e3a8a">Transactional outbox</text>
  <text x="352" y="385" font-size="11" font-weight="600" fill="#1e3a8a">Decides food safety. Not the LLM.</text>

  <!-- AuthorizedActionService -->
  <rect x="340" y="430" width="220" height="76" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="453" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">AuthorizedActionService</text>
  <text x="450" y="471" font-size="11" fill="#1e3a8a" text-anchor="middle">Green → execute · Amber → policy</text>
  <text x="450" y="488" font-size="11" fill="#1e3a8a" text-anchor="middle">Red → human decision</text>

  <!-- Decision requests -->
  <polygon points="450,560 560,610 450,660 340,610" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="450" y="605" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Decision Requests</text>
  <text x="450" y="622" font-size="11" fill="#78350f" text-anchor="middle">human review · resume</text>

  <!-- Strands agents -->
  <rect x="600" y="160" width="260" height="346" rx="14" fill="#faf5ff" stroke="#6d28d9" stroke-dasharray="5 3"/>
  <text x="730" y="184" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">Strands Agents (LLM reasoning)</text>
  <rect x="620" y="200" width="220" height="70" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="730" y="222" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">Intake Agent</text>
  <text x="730" y="239" font-size="11" fill="#4c1d95" text-anchor="middle">donor text → structured facts</text>
  <text x="730" y="255" font-size="11" fill="#4c1d95" text-anchor="middle">confidence · missing · contradictions</text>
  <rect x="620" y="286" width="220" height="86" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="730" y="308" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">Coordination Agent</text>
  <text x="730" y="325" font-size="11" fill="#4c1d95" text-anchor="middle">6 audited tools · bounded proposals</text>
  <text x="730" y="341" font-size="11" fill="#4c1d95" text-anchor="middle">get_rescue · get_policy · propose_action</text>
  <text x="730" y="357" font-size="11" fill="#4c1d95" text-anchor="middle">evaluate_constraints · request_information</text>
  <rect x="620" y="388" width="220" height="70" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="730" y="410" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">Exception Agent</text>
  <text x="730" y="427" font-size="11" fill="#4c1d95" text-anchor="middle">chooses among permitted</text>
  <text x="730" y="443" font-size="11" fill="#4c1d95" text-anchor="middle">deterministic recovery strategies</text>
  <text x="730" y="484" font-size="11" fill="#4c1d95" text-anchor="middle">safe hooks: no prompts, no reasoning logged</text>

  <!-- PostgreSQL -->
  <rect x="340" y="676" width="520" height="30" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="600" y="696" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">PostgreSQL — rescues · events · allocations · assignments · decisions · audit · outbox</text>

  <!-- Lane: AWS -->
  <rect x="910" y="96" width="290" height="620" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="930" y="122" font-size="14" font-weight="700" fill="#0f172a">AWS · us-east-1</text>
  <text x="930" y="140" font-size="12" fill="#64748b">Bedrock · AgentCore · CloudWatch</text>

  <rect x="930" y="200" width="250" height="96" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1055" y="222" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">AgentCore Runtime</text>
  <text x="1055" y="239" font-size="11" fill="#4c1d95" text-anchor="middle">relay_intake · Python 3.12 CodeZip</text>
  <text x="1055" y="255" font-size="11" fill="#4c1d95" text-anchor="middle">narrow Intake Agent ONLY</text>
  <text x="1055" y="271" font-size="11" fill="#4c1d95" text-anchor="middle">no tools · no state · no database</text>
  <text x="1055" y="287" font-size="11" fill="#4c1d95" text-anchor="middle">fail-closed safety guard</text>

  <rect x="930" y="340" width="250" height="60" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="1055" y="364" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Amazon Bedrock</text>
  <text x="1055" y="382" font-size="11" fill="#334155" text-anchor="middle">Claude via inference profile</text>

  <rect x="930" y="440" width="250" height="66" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="3 2"/>
  <text x="1055" y="464" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CloudWatch</text>
  <text x="1055" y="482" font-size="11" fill="#334155" text-anchor="middle">runtime invocation logs</text>
  <text x="1055" y="498" font-size="11" fill="#334155" text-anchor="middle">Transaction Search (active)</text>

  <text x="1055" y="560" font-size="11" fill="#64748b" text-anchor="middle">The rest of Relay does not run on AgentCore.</text>

  <!-- Edges -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <!-- UI -> events -->
    <path d="M270,188 L338,188"/>
    <!-- events -> engine -->
    <path d="M450,216 L450,246"/>
    <!-- engine -> agents -->
    <path d="M560,320 L618,320"/>
    <!-- agents -> authorization -->
    <path d="M700,458 L700,470 L560,470"/>
    <!-- authorization -> engine -->
    <path d="M400,430 L400,400"/>
    <!-- engine -> postgres -->
    <path d="M520,398 L520,674"/>
    <!-- agents -> Bedrock -->
    <path d="M840,360 L928,368"/>
    <!-- AgentCore -> Bedrock -->
    <path d="M1055,296 L1055,338"/>
    <!-- AgentCore -> CloudWatch -->
    <path d="M1140,296 L1140,438"/>
  </g>
  <!-- Intake agent deployed copy (dashed) -->
  <path d="M840,235 L928,235" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>
  <text x="884" y="228" font-size="10" fill="#6d28d9" text-anchor="middle">deployed copy</text>
  <!-- Red -> Decision requests, human -> engine -->
  <g stroke="#b45309" stroke-width="1.5" fill="none" marker-end="url(#arrowHuman)">
    <path d="M450,506 L450,558"/>
    <path d="M340,610 L300,610 L300,370 L242,370"/>
    <path d="M165,410 L165,700 L318,700"/>
  </g>
  <text x="300" y="500" font-size="10" fill="#b45309" text-anchor="middle" transform="rotate(-90 300 500)">Decision Card</text>
  <text x="240" y="694" font-size="10" fill="#b45309" text-anchor="middle">decision resolved → workflow resumes</text>
  <text x="470" y="534" font-size="10" fill="#b45309">red / ambiguous evidence</text>
</svg>
